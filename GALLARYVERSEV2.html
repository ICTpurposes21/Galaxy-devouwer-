<html>
<head>
  <title>Gallary Collection</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://fonts.googleapis.com/css2?family=Bangers&display=swap" rel="stylesheet">
  <style>
    body { background: black; margin: 0; font-family: Tahoma; }
    
    /* RED BLACK WHITE GRAFFITI - GALLARY COLLECTION */
    .top-title { 
      background: black; 
      text-align: center; 
      padding: 30px 0 15px 0; 
      line-height: 0.9; 
      font-family: 'Bangers', cursive; 
      text-transform: uppercase; 
    }
    .top-title .gallary { 
      display: block; 
      font-size: 55px; 
      color: #ff0000; /* RED */
      -webkit-text-stroke: 3.5px black; 
      text-shadow: 
        4px 4px 0px black,
        0 0 15px red,
        0 0 30px rgba(255,0,0,0.6);
      letter-spacing: 3px; 
      transform: rotate(-2deg);
    }
    .top-title .gallary::before { 
      content: "👑"; 
      display: block; 
      font-size: 28px; 
      margin-bottom: -10px; 
      filter: drop-shadow(2px 2px 0 black);
    }
    .top-title .collection { 
      display: block; 
      font-size: 52px; 
      color: white; /* WHITE */
      -webkit-text-stroke: 3.5px black; /* BLACK OUTLINE */
      text-shadow: 
        4px 4px 0px black,
        0 0 15px white;
      letter-spacing: 2px; 
      transform: rotate(-1deg); 
      margin-top: -5px;
    }

    /* BACK TO GALLERY VERSE - NOW WITH YOUR 3 PICS EFFECT */
    .back {
      display: block;
      text-decoration: none;
      text-align: left;
      padding: 15px 15px 20px 15px;
      font-family: "Impact", "Arial Black", sans-serif;
      font-weight: 900;
      font-size: 24px;
      color: black;
      -webkit-text-stroke: 1px white;
      text-shadow: 0 0 10px white, 0 0 25px white;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .gallery-grid img { 
      width: 99%; 
      height: 250px; 
      object-fit: cover; 
      border-radius: 8px; 
      border: 2px solid #222; 
      display: block; 
      margin-bottom: 10px; 
    }
  </style>
</head>
<body>

  <a class="back" href="GALLARYVERSE.html">← Back to Gallary Verse</a>

  <div class="top-title">
    <span class="gallary">GALLARY</span>
    <span class="collection">COLLECTION</span>
  </div>

  <div class="gallery-grid">
    <img src="91e4de934b25e792d172b41c17560494.jpg">
    <hr size="10" color="Black" width="100">

    <img src="00981b2bdb22db1006cdc7f3b2ec520e.jpg">
    <hr size="10" color="Black" width="100">

    <img src="b98808c5fdebb51f5436669d1126c482.jpg">
  </div>

</body>
</html>
